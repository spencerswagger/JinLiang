version: 1
job: acc-mysql-pg
source:
  kind: mysql
  dsn: env:JINLIANG_TEST_MYSQL_SRC_DSN
  scope: {schema: jinliang_src}
  snapshot: {chunk_rows: 5000}
target:
  kind: postgres
  dsn: env:JINLIANG_TEST_PG_DSN
  schema: public
  on_exists: append
content:
  tables:
    acc_mp: {}
mode: {frequency: continuous+initial}
reliability: {batch_rows: 5000}
