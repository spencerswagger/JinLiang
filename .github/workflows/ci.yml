name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: 单二进制体积守门（<25 MB）
        run: scripts/check_binary_size.sh

  testmatrix:
    # 每个连接器必须带可测性清单，否则视为未完成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every connector must ship testmatrix.yaml
        run: |
          set -e
          fail=0
          for d in connectors/*/; do
            [ -f "$d/testmatrix.yaml" ] || { echo "missing $d/testmatrix.yaml"; fail=1; }
          done
          exit $fail

  schema:
    # job.yaml 必须能被 JSON Schema 校验（编辑器/AI 助手也靠它理解配置）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate examples against schema
        run: |
          pip install --quiet pyyaml jsonschema
          python scripts/validate_schema.py examples/*.yaml

  control-plane:
    # 控制面 B0：起一个真 PostgreSQL + 真 MySQL，用纯 curl 走完整条链（验收 ①②③④）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jinliang
          POSTGRES_PASSWORD: jinliang
          POSTGRES_DB: jinliang_src
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jinliang"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ujinliang -pjinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 准备第二套测试库（b4 集成测试需要源/目标分离）
        run: |
          set -e
          PGPASSWORD=jinliang psql -h 127.0.0.1 -U jinliang -d jinliang_src -tAc \
            "SELECT 1 FROM pg_database WHERE datname='jinliang_test'" | grep -q 1 || \
            PGPASSWORD=jinliang psql -h 127.0.0.1 -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_src;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
      - name: 控制面单元/接口测试
        run: go test ./internal/...
      - name: 装校验依赖（让 e2e 里的 schema 校验跑真 jsonschema）
        run: pip install --quiet pyyaml jsonschema
      - name: 准备测试表
        run: go run ./test/fixture
      - name: b4 集成测试（verify / gc / doctor / remedy，缺 DSN 会红）
        run: go test -tags=integration ./internal/verify ./internal/gc ./internal/doctor ./internal/remedy
      - name: headless 全链路（纯 curl，不经浏览器）
        run: |
          set -e
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/jinliang ./cmd/jinliang
          scripts/e2e_headless.sh ./dist/jinliang
      - name: examples 过 schema
        run: python scripts/validate_schema.py examples/*.yaml
      - name: 交叉编译（CGO_ENABLED=0 必须能出三平台）
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/jinliang
          done
