name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: 单二进制体积守门（<25 MB）
        run: scripts/check_binary_size.sh

  race:
    # 并发安全单独一档：SSE 的订阅/发布、心跳 ticker、暂停/停止/取消路径，
    # 只有 -race 能稳定暴露问题（PR #5 里那颗 send-on-closed-channel 就是这么找出来的）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...

  testmatrix:
    # 每个连接器必须带可测性清单，否则视为未完成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every connector must ship testmatrix.yaml
        run: |
          set -e
          fail=0
          for d in connectors/*/; do
            [ -f "$d/testmatrix.yaml" ] || { echo "missing $d/testmatrix.yaml"; fail=1; }
          done
          exit $fail

  schema:
    # job.yaml 必须能被 JSON Schema 校验（编辑器/AI 助手也靠它理解配置）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate examples against schema
        run: |
          pip install --quiet pyyaml jsonschema
          python scripts/validate_schema.py examples/*.yaml
      - name: testmatrix 覆盖 9 PG × 4 MySQL（required/nightly 分层）
        run: python scripts/check_testmatrix.py

  control-plane:
    # 控制面：起真 PostgreSQL + 真 MySQL，用纯 curl 走完整条链（验收 ①②③④）。
    #
    # PostgreSQL 不用 services：B1 引擎要建逻辑复制书签，要求 wal_level=logical，
    # 而 services 只能传环境变量、不能给容器加启动参数（默认是 replica，会报
    # "logical decoding requires wal_level >= logical"）。所以用 docker run 显式带参数。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ujinliang -pjinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 起 PostgreSQL（wal_level=logical：B1 引擎要建逻辑书签）
        run: |
          set -e
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 5432:5432 postgres:16 -c wal_level=logical
          # 注意：不能只等 pg_isready —— initdb 期间会先起一个临时实例应答，
          # 随后重启，psql 会撞上 "the database system is shutting down"。
          # 所以直接轮询**真查询**，能查通才算起好。
          ok=0
          for _ in $(seq 1 90); do
            if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "--- pg-src 没起来 ---"; docker logs pg-src; exit 1; fi
          docker exec pg-src psql -U jinliang -d postgres -tAc "select current_setting('wal_level')"
      - name: 控制面单元/接口测试
        run: go test ./internal/...
      - name: 装校验依赖（让 e2e 里的 schema 校验跑真 jsonschema）
        run: pip install --quiet pyyaml jsonschema
      - name: 准备测试表
        run: go run ./test/fixture
      - name: 第二套库（b4 集成测试需要源/目标分离）
        run: |
          set -e
          docker exec pg-src psql -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_src;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
      - name: b4 集成测试（verify / gc / doctor / remedy，缺 DSN 会红）
        # 每个包用自己的 schema（jl_test_verify / jl_test_gc / jl_test_remedy），
        # 因此可以并行跑；不再需要 -p 1。
        run: go test -tags=integration ./internal/verify ./internal/gc ./internal/doctor ./internal/remedy
      - name: headless 全链路（纯 curl，不经浏览器）
        run: |
          set -e
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/jinliang ./cmd/jinliang
          scripts/e2e_headless.sh ./dist/jinliang
      - name: examples 过 schema
        run: python scripts/validate_schema.py examples/*.yaml
      - name: 交叉编译（CGO_ENABLED=0 必须能出三平台）
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/jinliang
          done

  b1-engine:
    # B1 引擎：源 → 目标**真链路**（全量 + 增量 + kill -9 重搬 + 指纹比对）。
    #
    # 为什么不用 services：逻辑复制要求 wal_level=logical，而 services 只能传环境变量、
    # 不能给容器加启动参数；所以这里用 docker run 显式带 `-c wal_level=logical` 起两个
    # 独立的 PostgreSQL（源与目标必须是两个库，否则会把表同步到自己身上）。
    #
    # 两个 DSN 由本 job 提供；脚本在缺变量时以 78（EX_CONFIG）退出 = 红，不静默跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: 备好 psql（验收脚本要连两个库核对指纹）
        run: |
          set -e
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq postgresql-client; }
          psql --version
      - name: 起两个 PostgreSQL（wal_level=logical）
        run: |
          set -e
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 55432:5432 postgres:16 -c wal_level=logical
          docker run -d --name pg-dst \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_test \
            -p 55433:5432 postgres:16 -c wal_level=logical
          for c in pg-src pg-dst; do
            # 不能只等 pg_isready：initdb 期间会先起一个临时实例应答，随后重启，
            # 紧接着的 psql 会撞上 "the database system is shutting down"。
            # 直接轮询真查询，能查通才算起好（与 control-plane job 同一修法）。
            ok=0
            for _ in $(seq 1 90); do
              if docker exec "$c" psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then echo "--- $c 没起来 ---"; docker logs "$c"; exit 1; fi
            docker exec "$c" psql -U jinliang -d postgres -tAc "select current_setting('wal_level')"
          done
      - name: 引擎单元测试（位点 / 事务组装 / 阶段机 / DDL 生成）
        run: go test ./internal/engine/ ./internal/pgsink/ ./internal/pgsource/ ./internal/pgwire/
      - name: 引擎真库集成测试（重搬不清用户表 / 同机租约 / 状态机）
        env:
          JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55432/jinliang_src?sslmode=disable
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
        # -v：让 CI 日志里能看见用例名（评审要能确认它真的跑了，而不是被跳过）。
        # -skip：MySQL 源那条用例要一个开了 binlog 的 MySQL 源库，本 job 没有——
        # 它在 b4-mysql-source job 里跑（那边的 DSN 是齐的）。跳过的只是那一条，
        # 其余用例照旧全跑；这条用例自己缺 DSN 时是**失败**，不是跳过。
        # -p 1：两个包共用同一个目标库，包级并行时一个包 DROP `_jl_*` 会踩到另一个包
        # 正在用的租约（TestLeaseNotStolenBySameInstance 就是这么偶发红的）。串行跑。
        run: go test -tags=integration -count=1 -v -p 1 -skip 'TestMySQLSource' ./internal/engine/ ./internal/pgsink/
      - name: 目标端批量 upsert 吞吐（增量 ≥20k ops/s 峰值 / ≥10k 稳态的门禁依据）
        env:
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
        run: |
          set -e
          go test -tags=integration -run '^$' -bench BenchmarkApplyUpsert500 -benchtime=40x ./internal/pgsink/ | tee /tmp/bench.txt
          # 阈值门禁：多行批量路径必须 ≥20000 rows/s（单行路径是基线对照，不设阈值）
          awk '/batch=500/ { for (i=1;i<=NF;i++) if ($i=="rows/s") print $(i-1) }' /tmp/bench.txt > /tmp/rate.txt
          rate=$(cat /tmp/rate.txt)
          echo "批量路径吞吐: $rate rows/s"
          awk -v r="$rate" 'BEGIN { exit !(r+0 >= 20000) }' || { echo "❌ 批量 upsert 吞吐 $rate 低于 20000 rows/s"; exit 1; }

      - name: B1 端到端（1M 行 + 增量 3 笔 + 指纹一致）
        env:
          JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55432/jinliang_src?sslmode=disable
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "300000"
          CHUNK_ROWS: "20000"
        run: |
          set -e
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/jinliang ./cmd/jinliang
          scripts/b1_pg_e2e.sh ./dist/jinliang
      - name: B1 端到端（append + 中途 kill：目标表是用户自己的，不许清空）
        env:
          JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55432/jinliang_src?sslmode=disable
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "300000"
          CHUNK_ROWS: "20000"
        run: |
          set -e
          scripts/b1_pg_e2e.sh ./dist/jinliang append
      - name: B1 端到端（快照中途 kill -9 后重搬，不重不丢）
        env:
          JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55432/jinliang_src?sslmode=disable
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "300000"
          CHUNK_ROWS: "20000"
        run: |
          set -e
          scripts/b1_pg_e2e.sh ./dist/jinliang kill
      - name: 失败时把两个库的日志打出来
        if: failure()
        run: |
          echo "=== pg-src ==="; docker logs pg-src 2>&1 | tail -50
          echo "=== pg-dst ==="; docker logs pg-dst 2>&1 | tail -50

  b4-mysql-source:
    # MySQL 源 → PG 目标：真 binlog 取流 + 真写 PG + 与 PG 源共用同一套块记账/位点语义，
    # 再跑一遍「快照中途 kill -9 → 从已提交的块边界续跑」。
    #
    # 为什么单独一个 job：它要一个开了 binlog（ROW + FULL）的 MySQL 源库，
    # 而 services 没法给容器追加 mysqld 参数（5.7 默认 log_bin=OFF，8.0 默认
    # binlog_row_metadata=MINIMAL 也不行——列名缺失会让目标端判成「结构漂移」）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: 备好 psql / mysql 客户端（验收脚本要连两个库核对指纹）
        run: |
          set -e
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq postgresql-client; }
          command -v mysql >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq mysql-client; }
          psql --version; mysql --version
      - name: 起 PostgreSQL 目标端
        run: |
          set -e
          docker run -d --name pg-dst             -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_test \
            -p 55433:5432 postgres:16
          ok=0
          for _ in $(seq 1 90); do
            if docker exec pg-dst psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "--- pg-dst 没起来 ---"; docker logs pg-dst; exit 1; }
      - name: 起 MySQL 源端（binlog ROW/FULL + 列元数据 FULL）
        run: |
          set -e
          docker run -d --name my-src \
            -e MYSQL_ROOT_PASSWORD=root \
            -p 3307:3306 \
            mysql:8.0 \
            --server-id=1 \
            --log-bin=mysql-bin \
            --binlog-format=ROW \
            --binlog-row-image=FULL \
            --binlog-row-metadata=FULL
          for i in $(seq 1 90); do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent 2>/dev/null; then break; fi
            sleep 2
          done
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_src CHARACTER SET utf8mb4;
            CREATE USER IF NOT EXISTS 'jinliang'@'%' IDENTIFIED WITH mysql_native_password BY 'jinliang';
            GRANT ALL PRIVILEGES ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;
            SHOW VARIABLES WHERE Variable_name IN
              ('log_bin','binlog_format','binlog_row_image','binlog_row_metadata');"
      - name: 引擎/连接器单元测试（位点顺序 / 表名映射 / 类型映射）
        run: go test ./internal/engine/ ./internal/mysqlsource/ ./internal/pgsink/
      - name: 真库集成测试（MySQL 源 → PG 目标：全量 + 块记账 + 增量追平删除）
        env:
          JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3307/jinliang_src
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
        run: go test -tags=integration -count=1 -v -run 'TestMySQLSource' ./internal/engine/
      - name: 端到端（MySQL → PG：全量 120k 行 + 增量 3 笔 + 指纹一致 + 追平时延）
        env:
          JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3307/jinliang_src
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "120000"
          CHUNK_ROWS: "1000"
        run: |
          set -e
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/jinliang ./cmd/jinliang
          scripts/b1_mysql_to_pg.sh ./dist/jinliang
      - name: 端到端（快照中途 kill -9：从已提交的块边界续跑，不重不丢）
        env:
          JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3307/jinliang_src
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "120000"
          CHUNK_ROWS: "1000"
        run: scripts/b1_mysql_to_pg.sh ./dist/jinliang kill
      - name: 失败时把两个库的日志打出来
        if: failure()
        run: |
          echo "=== my-src ==="; docker logs my-src 2>&1 | tail -50
          echo "=== pg-dst ==="; docker logs pg-dst 2>&1 | tail -50
