name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: 单二进制体积守门（<25 MB）
        run: scripts/check_binary_size.sh

  testmatrix:
    # 每个连接器必须带可测性清单，否则视为未完成
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every connector must ship testmatrix.yaml
        run: |
          set -e
          fail=0
          for d in connectors/*/; do
            [ -f "$d/testmatrix.yaml" ] || { echo "missing $d/testmatrix.yaml"; fail=1; }
          done
          exit $fail

  schema:
    # job.yaml 必须能被 JSON Schema 校验（编辑器/AI 助手也靠它理解配置）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate examples against schema
        run: |
          pip install --quiet pyyaml jsonschema
          python scripts/validate_schema.py examples/*.yaml

  control-plane:
    # 控制面 B0：起一个真 PostgreSQL + 真 MySQL，用纯 curl 走完整条链（验收 ①②③④）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jinliang
          POSTGRES_PASSWORD: jinliang
          POSTGRES_DB: jinliang_src
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jinliang"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ujinliang -pjinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 控制面单元/接口测试
        run: go test ./internal/...
      - name: 装校验依赖（让 e2e 里的 schema 校验跑真 jsonschema）
        run: pip install --quiet pyyaml jsonschema
      - name: 准备测试表
        run: go run ./test/fixture
      - name: headless 全链路（纯 curl，不经浏览器）
        run: |
          set -e
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/jinliang ./cmd/jinliang
          scripts/e2e_headless.sh ./dist/jinliang
      - name: examples 过 schema
        run: python scripts/validate_schema.py examples/*.yaml
      - name: 交叉编译（CGO_ENABLED=0 必须能出三平台）
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/jinliang
          done

  b1-engine:
    # B1 引擎：源 → 目标**真链路**（全量 + 增量 + kill -9 重搬 + 指纹比对）。
    #
    # 为什么不用 services：逻辑复制要求 wal_level=logical，而 services 只能传环境变量、
    # 不能给容器加启动参数；所以这里用 docker run 显式带 `-c wal_level=logical` 起两个
    # 独立的 PostgreSQL（源与目标必须是两个库，否则会把表同步到自己身上）。
    #
    # 两个 DSN 由本 job 提供；脚本在缺变量时以 78（EX_CONFIG）退出 = 红，不静默跳过。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: 备好 psql（验收脚本要连两个库核对指纹）
        run: |
          set -e
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y -qq postgresql-client; }
          psql --version
      - name: 起两个 PostgreSQL（wal_level=logical）
        run: |
          set -e
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 55432:5432 postgres:16 -c wal_level=logical
          docker run -d --name pg-dst \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_test \
            -p 55433:5432 postgres:16 -c wal_level=logical
          for c in pg-src pg-dst; do
            ok=0
            for _ in $(seq 1 90); do
              if docker exec "$c" pg_isready -U jinliang >/dev/null 2>&1; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then echo "--- $c 没起来 ---"; docker logs "$c"; exit 1; fi
            docker exec "$c" psql -U jinliang -tAc "select current_setting('wal_level')"
          done
      - name: 引擎单元测试（位点 / 事务组装 / 阶段机 / DDL 生成）
        run: go test ./internal/engine/ ./internal/pgsink/ ./internal/pgsource/ ./internal/pgwire/
      - name: B1 端到端（1M 行 + 增量 3 笔 + 指纹一致）
        env:
          JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55432/jinliang_src?sslmode=disable
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "300000"
          CHUNK_ROWS: "20000"
        run: |
          set -e
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/jinliang ./cmd/jinliang
          scripts/b1_pg_e2e.sh ./dist/jinliang
      - name: B1 端到端（快照中途 kill -9 后重搬，不重不丢）
        env:
          JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55432/jinliang_src?sslmode=disable
          JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55433/jinliang_test?sslmode=disable
          ROWS: "300000"
          CHUNK_ROWS: "20000"
        run: |
          set -e
          scripts/b1_pg_e2e.sh ./dist/jinliang kill
      - name: 失败时把两个库的日志打出来
        if: failure()
        run: |
          echo "=== pg-src ==="; docker logs pg-src 2>&1 | tail -50
          echo "=== pg-dst ==="; docker logs pg-dst 2>&1 | tail -50
