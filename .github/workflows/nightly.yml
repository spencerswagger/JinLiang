name: nightly

# nightly 门禁：全矩阵（9 PG × 4 MySQL）+ 全量集成 + 性能基线。
# 阈值不是「跑一下看看」：
#   - 矩阵：testmatrix.yaml 里 9/4 个版本逐个起真库，任一版本红即失败；
#   - 集成：所有 -tags=integration 包（含 engine / mysqlsource）；
#   - 性能：scripts/bench.sh --enforce（20k 行/s、p99≤100ms、空转≤80MB、冷启≤200ms、<25MB）。
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 CST
  workflow_dispatch:

jobs:
  pg-matrix:
    # 每个 PG 大版本起一套真库，跑 verify/gc/doctor/remedy 的集成用例。
    #
    # 为什么不用 services 起 PG：B1 引擎要建逻辑书签，要求 wal_level=logical，而
    # services 只能传环境变量、不能给容器加启动参数（默认 replica，会报
    # "logical decoding requires wal_level >= logical" / SQLSTATE 55000）。
    # 所以这里 docker run 显式带 `-c`，并且在跑用例前**断言**这些前提真的生效：
    # 配漏了就当场红，不让它退化成某个用例里的神秘报错（更不许跳过）。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["10", "11", "12", "13", "14", "15", "16", "17", "18"]
    services:
      # verify / doctor 里有一半用例是 MySQL 侧（缺 DSN 会直接失败，不跳过），
      # 所以 PG 矩阵 job 也要一套 MySQL；8.0 官方镜像默认 log_bin=ON。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_src
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 起 PostgreSQL ${{ matrix.pg }}（wal_level=logical）
        run: |
          set -euo pipefail
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 5432:5432 postgres:${{ matrix.pg }} \
            -c wal_level=logical -c max_replication_slots=40 -c max_wal_senders=40
          # 不能只等 pg_isready：initdb 期间会先起一个临时实例应答，随后立刻重启，
          # 紧接着的 psql 会撞上 "the database system is shutting down"。
          # 所以要求**连续两次**真查询都成功（间隔 2s）才算起好——单次成功会撞上
          # 那个临时实例（PG 17 上实测撞过一次）。
          ok=0
          for _ in $(seq 1 90); do
            if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then
              sleep 2
              if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "--- pg-src 没起来 ---"; docker logs pg-src; exit 1; }
      - name: 断言数据库前提（配漏了就红）
        run: |
          set -euo pipefail
          fail() { echo "❌ 缺数据库前提：$*"; exit 1; }
          # 库可能还在启动尾巴上（"the database system is shutting down"）：
          # 这是**启动竞态**，不是缺前提，重试 15 次再判。
          pgq() { for _ in $(seq 1 15); do if out=$(docker exec pg-src psql -U jinliang -d postgres -tAc "$1" 2>/dev/null); then echo "$out"; return 0; fi; sleep 2; done; return 1; }
          myq() { for _ in $(seq 1 30); do if out=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "$1" 2>/dev/null); then echo "$out"; return 0; fi; sleep 2; done; return 1; }

          wl=$(pgq "show wal_level") || fail "连不上 pg-src"
          slots=$(pgq "show max_replication_slots") || fail "连不上 pg-src"
          senders=$(pgq "show max_wal_senders") || fail "连不上 pg-src"
          echo "PG ${{ matrix.pg }}: wal_level=$wl max_replication_slots=$slots max_wal_senders=$senders"
          [ "$wl" = "logical" ] || fail "PG 的 wal_level=$wl（要 logical）：B1 引擎建逻辑书签会报 SQLSTATE 55000。services 传不了启动参数，必须 docker run … -c wal_level=logical"
          [ "$slots" -ge 20 ] || fail "max_replication_slots=$slots（要 ≥20）：多任务同时建书签会撞上限"
          [ "$senders" -ge 20 ] || fail "max_wal_senders=$senders（要 ≥20）"

          logbin=$(myq "select @@log_bin") || fail "连不上 MySQL"
          fmt=$(myq "select @@binlog_format") || fail "连不上 MySQL"
          img=$(myq "select @@binlog_row_image") || fail "连不上 MySQL"
          echo "MySQL: log_bin=$logbin binlog_format=$fmt binlog_row_image=$img"
          [ "$logbin" = "1" ] || fail "MySQL log_bin=$logbin（要 1）：没有 binlog 就没有变更流水"
          [ "$fmt" = "ROW" ] || fail "MySQL binlog_format=$fmt（要 ROW）"
          [ "$img" = "FULL" ] || fail "MySQL binlog_row_image=$img（要 FULL）"
      - name: 第二套库 + 复制权限
        run: |
          set -euo pipefail
          docker exec pg-src psql -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_test;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT ALL PRIVILEGES ON jinliang_test.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
      - name: PG ${{ matrix.pg }} 集成（verify/gc/doctor/remedy）
        # -v 让日志里有用例名；日志里出现 --- SKIP 就按失败处理（跳过＝没验）。
        run: |
          set -euo pipefail
          go test -tags=integration -count=1 -v ./internal/verify ./internal/gc ./internal/doctor ./internal/remedy 2>&1 | tee /tmp/go-test.log
          if grep -qE '^[[:space:]]*--- SKIP' /tmp/go-test.log; then
            echo "❌ 有用例被跳过（--- SKIP）：缺前提就是失败，不许静默通过"
            grep -E '^[[:space:]]*--- SKIP' /tmp/go-test.log
            exit 1
          fi
      - name: 备好 python 依赖（无主键矩阵执行器）
        run: pip install --quiet pyyaml
      - name: 无主键变体 × PG ${{ matrix.pg }}（T1 自洽，3 格）
        # 格的定义在 test/nopk-matrix.yaml；这一腿跑「PG 同一版本 → 同一版本」的
        # snapshot / insert / pause。格数由 scripts/check_testmatrix.py 对账。
        run: python3 scripts/nopk_matrix.py --layer nightly --link pg-pg --src-version "${{ matrix.pg }}" --dst-version "${{ matrix.pg }}" --expect-cells 3 --json "nopk-t1-${PG}.json"
        env:
          PG: ${{ matrix.pg }}
      - name: 无主键变体 × PG ${{ matrix.pg }} → MySQL 8.0（T4 抽样，本周 due 才跑）
        # T4 异构抽样：每周 2 条链，9 周轮完一轮。不是 due 的腿会打 status=not-due
        # （不是跳过：格在登记表里、只是本周不排它，报告里能看到）。
        run: python3 scripts/nopk_matrix.py --layer nightly --link pg-mysql --src-version "${{ matrix.pg }}" --dst-version 8.0 --if-due --expect-cells 1 --json "nopk-t4-pm-${PG}.json"
        env:
          PG: ${{ matrix.pg }}

  mysql-matrix:
    # MySQL 源矩阵：5.7 / 8.0 / 8.4 / 9.4 各起一套真库。
    #
    # 也不用 services：5.7 官方镜像默认 log_bin=OFF，而 services 没法给容器追加
    # mysqld 参数。这里 docker run 把源库该开的开关写清楚，并在跑用例前断言
    # （与 .github/workflows/mysql-matrix.yml 同一套参数）。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7", "8.0", "8.4", "9.4"]
    env:
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
      # verify / doctor 里有 PG 侧用例（缺 DSN 直接失败），这个 job 也要一套 PG。
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 起 MySQL ${{ matrix.mysql }}（binlog ROW + FULL 行镜像）
        run: |
          set -euo pipefail
          docker run -d --name my-src -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=jinliang_src \
            -e MYSQL_USER=jinliang \
            -e MYSQL_PASSWORD=jinliang \
            mysql:${{ matrix.mysql }} \
            --server-id=1 \
            --log-bin=mysql-bin \
            --binlog-format=ROW \
            --binlog-row-image=FULL
          # 同样要求连续两次 ping 都通：initialize 阶段会先起一个临时实例。
          ok=0
          for _ in $(seq 1 90); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              sleep 3
              if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then ok=1; break; fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "--- my-src 没起来 ---"; docker logs my-src; exit 1; }
      - name: 起 PostgreSQL 16（wal_level=logical）
        run: |
          set -euo pipefail
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 5432:5432 postgres:16 \
            -c wal_level=logical -c max_replication_slots=40 -c max_wal_senders=40
          # 不能只等 pg_isready：initdb 期间会先起一个临时实例应答，随后立刻重启。
          # 要求连续两次真查询都成功（间隔 2s）才算起好。
          ok=0
          for _ in $(seq 1 90); do
            if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then
              sleep 2
              if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "--- pg-src 没起来 ---"; docker logs pg-src; exit 1; }
      - name: 断言数据库前提（配漏了就红）
        run: |
          set -euo pipefail
          fail() { echo "❌ 缺数据库前提：$*"; exit 1; }
          # 库可能还在启动尾巴上（"the database system is shutting down"）：
          # 这是**启动竞态**，不是缺前提，重试 15 次再判。
          pgq() { for _ in $(seq 1 15); do if out=$(docker exec pg-src psql -U jinliang -d postgres -tAc "$1" 2>/dev/null); then echo "$out"; return 0; fi; sleep 2; done; return 1; }
          myq() { for _ in $(seq 1 30); do if out=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "$1" 2>/dev/null); then echo "$out"; return 0; fi; sleep 2; done; return 1; }

          logbin=$(myq "select @@log_bin") || fail "连不上 MySQL"
          fmt=$(myq "select @@binlog_format") || fail "连不上 MySQL"
          img=$(myq "select @@binlog_row_image") || fail "连不上 MySQL"
          sid=$(myq "select @@server_id") || fail "连不上 MySQL"
          echo "MySQL ${{ matrix.mysql }}: log_bin=$logbin binlog_format=$fmt binlog_row_image=$img server_id=$sid"
          [ "$logbin" = "1" ] || fail "MySQL ${{ matrix.mysql }} 的 log_bin=$logbin（要 1）：5.7 默认关闭，必须 docker run 带 --log-bin"
          [ "$fmt" = "ROW" ] || fail "MySQL 的 binlog_format=$fmt（要 ROW）"
          [ "$img" = "FULL" ] || fail "MySQL 的 binlog_row_image=$img（要 FULL）"
          [ "$sid" != "0" ] || fail "MySQL 的 server_id=0：binlog 事件没法归组"

          wl=$(pgq "show wal_level") || fail "连不上 pg-src"
          echo "PG: wal_level=$wl"
          [ "$wl" = "logical" ] || fail "PG 的 wal_level=$wl（要 logical）"
      - name: 第二套库 + 复制权限
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_test;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT ALL PRIVILEGES ON jinliang_test.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
          docker exec pg-src psql -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
      - name: MySQL ${{ matrix.mysql }} 集成（mysqlsource/verify/doctor）
        # -v 让日志里有用例名；日志里出现 --- SKIP 就按失败处理（跳过＝没验）。
        run: |
          set -euo pipefail
          go test -tags=integration -count=1 -v ./internal/mysqlsource ./internal/verify ./internal/doctor 2>&1 | tee /tmp/go-test.log
          if grep -qE '^[[:space:]]*--- SKIP' /tmp/go-test.log; then
            echo "❌ 有用例被跳过（--- SKIP）：缺前提就是失败，不许静默通过"
            grep -E '^[[:space:]]*--- SKIP' /tmp/go-test.log
            exit 1
          fi
      - name: 备好 python 依赖（无主键矩阵执行器）
        run: pip install --quiet pyyaml
      - name: 无主键变体 × MySQL ${{ matrix.mysql }} → PG 16（T4 抽样，本周 due 才跑）
        # MySQL 侧的版本档是 5.7 / 8.0 / 8.4 / 9.4，登记表里 9.x 的标签是 "9"：
        # 执行器的版本过滤认前缀（9.4 命中 9），不会因为标签写法不同而漏格。
        # --expect-cells 的口径是「链数 × 场景数」，不是链数：MySQL→PG 每条链 3 场景，
        # 所以这里恒 3（--if-due 只把格标成 not-due，不减少选中数）；PG→MySQL 只全量，那一条是 1。
        run: python3 scripts/nopk_matrix.py --layer nightly --link mysql-pg --src-version "${{ matrix.mysql }}" --dst-version 16 --if-due --expect-cells 3 --json "nopk-t4-mp-${MY}.json"
        env:
          MY: ${{ matrix.mysql }}

  nopk-pairs:
    # 无主键变体的 T2（相邻升级 2 条）/ T3（极端跨度 3 条 + 降级 1 条）：
    # 每条链一套真库（源/目标版本不同，起两个容器），3 格（降级只 1 格）。
    # 单独成 job 是因为它们要**两个不同版本**的 PG，pg-matrix 那个 job 是单版本。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - src: "10"
            dst: "11"
            tier: "T2 相邻升级"
            expect: 3
          - src: "17"
            dst: "18"
            tier: "T2 相邻升级"
            expect: 3
          - src: "10"
            dst: "18"
            tier: "T3 极端跨度"
            expect: 3
          - src: "18"
            dst: "10"
            tier: "T3 降级（只验允许继续；提示未实现）"
            expect: 1
    name: 无主键 × PG ${{ matrix.src }}→${{ matrix.dst }}（${{ matrix.tier }}）
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55442/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55443/jinliang_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 备好 python 依赖（无主键矩阵执行器）
        run: pip install --quiet pyyaml
      - name: 起真库（PG ${{ matrix.src }} 源 / PG ${{ matrix.dst }} 目标）
        # 与 PR 门禁、release、nopk-dry-run 同一段编排（scripts/ci/nopk_dbs.sh）。
        run: bash scripts/ci/nopk_dbs.sh pg "${{ matrix.src }}" "${{ matrix.dst }}"
      - name: 无主键变体 × PG ${{ matrix.src }}→${{ matrix.dst }}
        run: python3 scripts/nopk_matrix.py --layer nightly --link pg-pg --src-version "${{ matrix.src }}" --dst-version "${{ matrix.dst }}" --expect-cells ${{ matrix.expect }} --json nopk-${{ matrix.src }}-${{ matrix.dst }}.json
      - name: 结果进 job summary
        if: always()
        run: |
          { echo "### 无主键变体：PG ${{ matrix.src }} → PG ${{ matrix.dst }}（${{ matrix.tier }}）"; echo;
            shopt -s nullglob
            for f in nopk-*.json; do echo '```json'; cat "$f"; echo '```'; done; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nopk-pg-${{ matrix.src }}-${{ matrix.dst }}
          path: nopk-*.json

  integration:
    # 一套 PG + 一套 MySQL，跑所有集成包（engine 的重搬用例也在这里）。
    #
    # PG 仍用 docker run 而不是 services：engine 的逻辑书签要 wal_level=logical，
    # services 传不了启动参数（这就是 nightly 长期红的原因）。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_src
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 起 PostgreSQL 16（wal_level=logical）
        run: |
          set -euo pipefail
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 5432:5432 postgres:16 \
            -c wal_level=logical -c max_replication_slots=40 -c max_wal_senders=40
          # 不能只等 pg_isready：initdb 期间会先起一个临时实例应答，随后立刻重启，
          # 紧接着的 psql 会撞上 "the database system is shutting down"。
          # 要求连续两次真查询都成功（间隔 2s）才算起好。
          ok=0
          for _ in $(seq 1 90); do
            if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then
              sleep 2
              if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "--- pg-src 没起来 ---"; docker logs pg-src; exit 1; }
      - name: 断言数据库前提（配漏了就红）
        run: |
          set -euo pipefail
          fail() { echo "❌ 缺数据库前提：$*"; exit 1; }
          # 库可能还在启动尾巴上（"the database system is shutting down"）：
          # 这是**启动竞态**，不是缺前提，重试 15 次再判。
          pgq() { for _ in $(seq 1 15); do if out=$(docker exec pg-src psql -U jinliang -d postgres -tAc "$1" 2>/dev/null); then echo "$out"; return 0; fi; sleep 2; done; return 1; }
          myq() { for _ in $(seq 1 30); do if out=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e "$1" 2>/dev/null); then echo "$out"; return 0; fi; sleep 2; done; return 1; }

          wl=$(pgq "show wal_level") || fail "连不上 pg-src"
          slots=$(pgq "show max_replication_slots") || fail "连不上 pg-src"
          senders=$(pgq "show max_wal_senders") || fail "连不上 pg-src"
          echo "PG: wal_level=$wl max_replication_slots=$slots max_wal_senders=$senders"
          [ "$wl" = "logical" ] || fail "PG 的 wal_level=$wl（要 logical）：engine 建逻辑书签会报 SQLSTATE 55000"
          [ "$slots" -ge 20 ] || fail "max_replication_slots=$slots（要 ≥20）"
          [ "$senders" -ge 20 ] || fail "max_wal_senders=$senders（要 ≥20）"

          logbin=$(myq "select @@log_bin") || fail "连不上 MySQL"
          fmt=$(myq "select @@binlog_format") || fail "连不上 MySQL"
          img=$(myq "select @@binlog_row_image") || fail "连不上 MySQL"
          echo "MySQL: log_bin=$logbin binlog_format=$fmt binlog_row_image=$img"
          [ "$logbin" = "1" ] || fail "MySQL log_bin=$logbin（要 1）"
          [ "$fmt" = "ROW" ] || fail "MySQL binlog_format=$fmt（要 ROW）"
          [ "$img" = "FULL" ] || fail "MySQL binlog_row_image=$img（要 FULL）"
      - name: 准备两套库
        run: |
          set -euo pipefail
          docker exec pg-src psql -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_test;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT ALL PRIVILEGES ON jinliang_test.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
      - name: 全量集成（含 engine / mysqlsource）
        env:
          # 本 job 独占这套 docker run 起来的 PG，所以允许包首尾回收上一轮泄漏的空闲书签。
          JINLIANG_TEST_RECLAIM_SLOTS: "1"
        # 资源隔离（不是 -p 1）：mysqlsource 的 Snapshot 枚举整个源库；mysqlsink、
        # engine、pgsink 各自在 public 里建/删 _jl_* 状态表，彼此会抢；verify/gc/
        # doctor/remedy 用独立 schema，可以并行。
        #
        # 每条命令都过 runOne：-v 让日志里有用例名，跑完再查一遍有没有 --- SKIP。
        # 跳过＝没验（#75 的教训：Skip 让缺口静默通过），所以有一处 SKIP 就整步失败。
        run: |
          set -euo pipefail
          runOne() {
            go test -tags=integration -count=1 -v "$@" 2>&1 | tee /tmp/go-test.log
            if grep -qE '^[[:space:]]*--- SKIP' /tmp/go-test.log; then
              echo "❌ 有用例被跳过（--- SKIP）：缺前提就是失败，不许静默通过"
              grep -E '^[[:space:]]*--- SKIP' /tmp/go-test.log
              return 1
            fi
          }
          runOne ./internal/mysqlsource
          runOne ./internal/mysqlsink
          runOne ./internal/engine
          runOne ./internal/pgsink
          runOne ./internal/verify ./internal/gc ./internal/doctor ./internal/remedy

  bench:
    # 性能基线。PG 也用 docker run：与集成 job 保持同一套前提（wal_level=logical），
    # 免得「换了个 job 就跑在另一套配置上」这种隐性差异。
    runs-on: ubuntu-latest
    env:
      JINLIANG_TEST_PG_DSN: "postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 起 PostgreSQL 16（wal_level=logical）
        run: |
          set -euo pipefail
          docker run -d --name pg-src \
            -e POSTGRES_USER=jinliang -e POSTGRES_PASSWORD=jinliang -e POSTGRES_DB=jinliang_src \
            -p 5432:5432 postgres:16 \
            -c wal_level=logical -c max_replication_slots=40 -c max_wal_senders=40
          # 连续两次真查询都成功才算起好（initdb 的临时实例会应答一次就重启）。
          ok=0
          for _ in $(seq 1 90); do
            if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then
              sleep 2
              if docker exec pg-src psql -U jinliang -d postgres -tAc "select 1" >/dev/null 2>&1; then ok=1; break; fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "--- pg-src 没起来 ---"; docker logs pg-src; exit 1; }
          wl=$(docker exec pg-src psql -U jinliang -d postgres -tAc "show wal_level")
          echo "PG: wal_level=$wl"
          [ "$wl" = "logical" ] || { echo "❌ PG 的 wal_level=$wl（要 logical）；缺了它 B1 引擎建逻辑书签会报 SQLSTATE 55000"; exit 1; }
      - name: 第二套库
        run: |
          set -euo pipefail
          docker exec pg-src psql -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
      - name: 性能基线（不达标即红）
        run: scripts/bench.sh --enforce --out bench/latest.json
      - name: 目标端批量 upsert 吞吐（增量峰值门禁 ≥20k rows/s）
        # 这道门禁原在 PR 的 b1-engine 里，每次 PR 都跑一遍太贵，挪到 nightly；
        # 覆盖不丢。三条硬约束（都是「不许静默通过」的具体化）：
        #   1) pipefail：go test 自己失败必须跟着失败，不能被 `| tee` 吞掉；
        #   2) 没测到数值＝失败：rate 为空时 `r+0` 会被当成 0，这里先显式判空；
        #   3) 低于阈值直接红，并把实测数字打进日志。
        run: |
          set -euo pipefail
          # 阈值只写这一个地方，判定和文案都引用它，避免两处漂移。
          # 20000 是「崩塌才红」的峰值门禁（不是性能基线：p99/内存/冷启在 scripts/bench.sh）。
          THRESHOLD=20000
          # -count=5 + 取中位数：单次 40 iterations 在 shared runner 上实测 **14474~174350 rows/s（约 12 倍）**，
          # 20000 只是「崩塌」下限。3 个样本只能容忍 1 个慢样本（同轮出现两个 14474 这种就误红），
          # 所以取 5 个、容忍 2 个慢样本；多数样本都慢 → 中位数也慢 → 照样红。
          go test -tags=integration -run '^$' -bench BenchmarkApplyUpsert500 -benchtime=40x -count=5 ./internal/pgsink/ | tee /tmp/bench.txt
          # `|| true`：没匹配到时也要走到下面的显式判空（否则 set -e/pipefail 会静默退出，
          # 红是红了，但日志里没有「为什么」）。
          # 样本提取：兼容 Go 在 ≥1e6 时打印的科学计数法（`1.2e+06 rows/s`）。
          # 这种样本按 1e6 这个**下限**参与比较（真实值只会更大，所以方向偏保守，不会放松门禁）。
          toks=$(grep 'batch=500' /tmp/bench.txt | grep -oE '[0-9][0-9.e+]* rows/s' | sed 's/ rows\/s//' || true)
          rates=''
          for tok in $toks; do
            # 数值解析，不硬映射：Go 在 ≥1e6 时打印 `1.2e+06 rows/s`，
            # 也可能出现 `1.5e+05`——硬当 1e6 会**高估**（偏松）。printf %.0f 直接把两种写法都转成整数。
            v=$(printf '%.0f' "$tok" 2>/dev/null || true)
            [ -n "$v" ] || { echo "❌ 吞吐样本 %s 解析不出数值（benchmark 输出格式变了）——这不算通过" "$tok"; exit 1; }
            rates="$rates$(printf '\n%s' "$v")"
          done
          rates=$(printf '%s\n' "$rates" | sed '/^$/d' | sort -n || true)
          n=$(echo "$rates" | grep -c . || true)
          echo "batch=500 实测 $n 次: $(echo "$rates" | tr '\n' ' ')"
          # 样本数按**实际**取，不假定正好 3 个：输出格式一变被正则丢掉一两个，
          # 死取第 2 行会退化成「2 个里取较大者」= 偏松。少样本直接失败，别静默用少样本过门禁。
          [ "$n" -ge 2 ] || { echo "❌ batch=500 样本数 $n < 2：样本不足不许过门禁（benchmark 没跑或输出格式变了）"; tail -30 /tmp/bench.txt; exit 1; }
          idx=$(( (n + 1) / 2 ))   # 保守取下半中位数：n=2→第1小、n=3→第2小、n=4→第2小
          rate=$(echo "$rates" | sed -n "${idx}p")
          echo "批量路径吞吐（中位数）: $rate rows/s（阈值 $THRESHOLD）"
          [ "$rate" -ge "$THRESHOLD" ] || { echo "❌ 批量 upsert 吞吐中位数 $rate 低于阈值 $THRESHOLD rows/s"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ github.run_id }}
          path: bench/latest.json
