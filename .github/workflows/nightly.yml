name: nightly

# nightly 门禁：全矩阵（9 PG × 4 MySQL）+ 全量集成 + 性能基线。
# 阈值不是「跑一下看看」：
#   - 矩阵：testmatrix.yaml 里 9/4 个版本逐个起真库，任一版本红即失败；
#   - 集成：所有 -tags=integration 包（含 engine / mysqlsource）；
#   - 性能：scripts/bench.sh --enforce（20k 行/s、p99≤100ms、空转≤80MB、冷启≤200ms、<25MB）。
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 CST
  workflow_dispatch:

jobs:
  pg-matrix:
    # 每个 PG 大版本起一套真库，跑 verify/gc/doctor/remedy 的集成用例。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["10", "11", "12", "13", "14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: jinliang
          POSTGRES_PASSWORD: jinliang
          POSTGRES_DB: jinliang_src
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 第二套库
        run: |
          set -e
          PGPASSWORD=jinliang psql -h 127.0.0.1 -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
      - name: PG ${{ matrix.pg }} 集成（verify/gc/doctor/remedy）
        run: go test -tags=integration ./internal/verify ./internal/gc ./internal/doctor ./internal/remedy

  mysql-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7", "8.0", "8.4", "9.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 第二套库 + 复制权限
        run: |
          set -e
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_src;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
      - name: MySQL ${{ matrix.mysql }} 集成（mysqlsource/verify/doctor）
        run: go test -tags=integration ./internal/mysqlsource ./internal/verify ./internal/doctor

  integration:
    # 一套 PG + 一套 MySQL，跑所有集成包（engine 的重搬用例也在这里）。
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jinliang
          POSTGRES_PASSWORD: jinliang
          POSTGRES_DB: jinliang_src
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: jinliang
          MYSQL_PASSWORD: jinliang
          MYSQL_DATABASE: jinliang_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ujinliang -pjinliang"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_test
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:3306/jinliang_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 准备两套库
        run: |
          set -e
          PGPASSWORD=jinliang psql -h 127.0.0.1 -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS jinliang_src;
            GRANT ALL PRIVILEGES ON jinliang_src.* TO 'jinliang'@'%';
            GRANT REPLICATION CLIENT, REPLICATION SLAVE ON *.* TO 'jinliang'@'%';
            FLUSH PRIVILEGES;"
      - name: 全量集成（含 engine / mysqlsource）
        # 资源隔离（不是 -p 1）：mysqlsource 的 Snapshot 枚举整个源库；mysqlsink、
        # engine、pgsink 各自在 public 里建/删 _jl_* 状态表，彼此会抢；verify/gc/
        # doctor/remedy 用独立 schema，可以并行。
        run: |
          set -e
          go test -tags=integration ./internal/mysqlsource
          go test -tags=integration ./internal/mysqlsink
          go test -tags=integration ./internal/engine
          go test -tags=integration ./internal/pgsink
          go test -tags=integration ./internal/verify ./internal/gc ./internal/doctor ./internal/remedy

  bench:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jinliang
          POSTGRES_PASSWORD: jinliang
          POSTGRES_DB: jinliang_src
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      JINLIANG_TEST_PG_DSN: "postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 第二套库
        run: |
          set -e
          PGPASSWORD=jinliang psql -h 127.0.0.1 -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
      - name: 性能基线（不达标即红）
        run: scripts/bench.sh --enforce --out bench/latest.json
      - name: 目标端批量 upsert 吞吐（增量峰值门禁，≥20k）
        run: |
          set -e
          go test -tags=integration -run '^$' -bench BenchmarkApplyUpsert500 -benchtime=40x ./internal/pgsink/ | tee /tmp/bench.txt
          awk '/batch=500/ { for (i=1;i<=NF;i++) if ($i=="rows/s") print $(i-1) }' /tmp/bench.txt > /tmp/rate.txt
          rate=$(cat /tmp/rate.txt)
          echo "批量路径吞吐: $rate rows/s"
          awk -v r="$rate" 'BEGIN { exit !(r+0 >= 20000) }' || { echo "❌ 批量 upsert 吞吐 $rate 低于 20000 rows/s"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ github.run_id }}
          path: bench/latest.json

  cross-compile:
    # 三平台交叉编译原来在 PR 的 control-plane 里（71s），移到 nightly：
    # PR 只保证本机 linux/amd64 能编译，平台覆盖由 nightly/release 守。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 交叉编译（linux/amd64, linux/arm64, darwin/arm64）
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/jinliang
          done
