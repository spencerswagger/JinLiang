name: release

# release 门禁（打 tag 时）：三平台编译 + 性能回归对比 + 二进制体积 + 覆盖度门槛。
# 与 nightly 的区别：nightly 收集基线，release 用仓库里的 bench/baseline.json
# 做回归对比（>15% 变差即红；CPU 型号不同时只查绝对阈值并警告）。
on:
  push:
    tags: ["v*"]

jobs:
  cross-compile:
    # 打 tag 前先把三平台编译真跑一遍（约 80s）。为什么放在 release 里：
    # 被 tag 的 commit 理论上已经在 main 上过了 `ci` 的 cross-compile，但「理论上」靠人记性——
    # 从特性分支直接打 tag、或 tag 打了没跑过 CI 的 commit，就会发出一个 arm64/darwin 编不过的版本。
    # 实际动作在 scripts/cross-compile.sh（与 ci.yml 的 cross-compile job 同一份脚本，
    # 平台列表只在这里之外的一个地方定义）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 交叉编译（三平台，真源在 scripts/cross-compile.sh）
        run: scripts/cross-compile.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: 覆盖度门槛（单元总覆盖 ≥ 40%）
        run: scripts/coverage.sh --check --min 40

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: 单二进制 < 25 MB
        run: scripts/check_binary_size.sh dist/jinliang

  bench-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jinliang
          POSTGRES_PASSWORD: jinliang
          POSTGRES_DB: jinliang_src
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jinliang"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      JINLIANG_TEST_PG_DSN: "postgres://jinliang:jinliang@127.0.0.1:5432/jinliang_test?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: 第二套库
        run: |
          set -e
          PGPASSWORD=jinliang psql -h 127.0.0.1 -U jinliang -d jinliang_src -c 'CREATE DATABASE jinliang_test'
      - name: 性能基线（绝对阈值）
        run: scripts/bench.sh --enforce --out bench/latest.json
      - name: 与 bench/baseline.json 对比（>15% 回归即红）
        run: scripts/bench_compare.py bench/baseline.json bench/latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-release-${{ github.ref_name }}
          path: bench/latest.json

  nopk-release-cross:
    # 无主键变体的 release T4 全量（docs/DESIGN-NO-PRIMARY-KEY.md §2.4）：
    # MySQL 4 档 × PG 9 档，两个方向各一条链 —— MySQL→PG 三场景（含改/删触发暂停）、
    # PG→MySQL 只全量（direction.go 的 Modes）。每格都是真库上的一次执行，
    # 格数由 scripts/check_testmatrix.py 按 test/nopk-matrix.yaml 对账（release 184 格）。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.7", "8.0", "8.4", "9.4"]
        pg: ["10", "11", "12", "13", "14", "15", "16", "17", "18"]
    name: 无主键 release × MySQL ${{ matrix.mysql }} ↔ PG ${{ matrix.pg }}
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55442/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55443/jinliang_test?sslmode=disable
      JINLIANG_TEST_MYSQL_SRC_DSN: mysql://jinliang:jinliang@127.0.0.1:55306/jinliang_src
      JINLIANG_TEST_MYSQL_DSN: mysql://jinliang:jinliang@127.0.0.1:55307/jinliang_target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 备好 python 依赖（无主键矩阵执行器）
        run: pip install --quiet pyyaml
      - name: 起真库（PG ${{ matrix.pg }} 双库 + MySQL ${{ matrix.mysql }} 双库）
        run: bash scripts/ci/nopk_dbs.sh cross "${{ matrix.mysql }}" "${{ matrix.pg }}"
      - name: 无主键变体（MySQL→PG 3 格 + PG→MySQL 1 格）
        run: |
          set -e
          python3 scripts/nopk_matrix.py --layer release --link mysql-pg \
            --src-version "${{ matrix.mysql }}" --dst-version "${{ matrix.pg }}" --json nopk-mp.json
          python3 scripts/nopk_matrix.py --layer release --link pg-mysql \
            --src-version "${{ matrix.pg }}" --dst-version "${{ matrix.mysql }}" --json nopk-pm.json
      - name: 结果进 job summary
        if: always()
        run: |
          { echo "### 无主键 release：MySQL ${{ matrix.mysql }} ↔ PG ${{ matrix.pg }}"; echo;
            for f in nopk-*.json; do [ -f "$f" ] && { echo '```json'; cat "$f"; echo '```'; }; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nopk-release-my${{ matrix.mysql }}-pg${{ matrix.pg }}
          path: nopk-*.json

  nopk-release-pg:
    # 无主键变体 release 的 PG 侧：T1 自洽 9 条、T2 相邻 2 条、T3 极端 2 条（含 18→10 降级）、
    # 以及 unique_key 的 2 格（声明身份 + once 合并 / continuous 改删）。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { src: "10", dst: "10" }
          - { src: "11", dst: "11" }
          - { src: "12", dst: "12" }
          - { src: "13", dst: "13" }
          - { src: "14", dst: "14" }
          - { src: "15", dst: "15" }
          - { src: "16", dst: "16" }
          - { src: "17", dst: "17" }
          - { src: "18", dst: "18" }
          - { src: "10", dst: "11" }
          - { src: "17", dst: "18" }
          - { src: "10", dst: "18" }
          - { src: "18", dst: "10" }
    name: 无主键 release × PG ${{ matrix.src }}→${{ matrix.dst }}
    env:
      JINLIANG_TEST_PG_SRC_DSN: postgres://jinliang:jinliang@127.0.0.1:55442/jinliang_src?sslmode=disable
      JINLIANG_TEST_PG_DSN: postgres://jinliang:jinliang@127.0.0.1:55443/jinliang_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: 备好 python 依赖（无主键矩阵执行器）
        run: pip install --quiet pyyaml
      - name: 起真库（PG ${{ matrix.src }} 源 / PG ${{ matrix.dst }} 目标）
        run: bash scripts/ci/nopk_dbs.sh pg "${{ matrix.src }}" "${{ matrix.dst }}"
      - name: 无主键变体（PG ${{ matrix.src }}→PG ${{ matrix.dst }}）
        run: python3 scripts/nopk_matrix.py --layer release --link pg-pg --src-version "${{ matrix.src }}" --dst-version "${{ matrix.dst }}" --json "nopk-pg-${{ matrix.src }}-${{ matrix.dst }}.json"
      - name: 结果进 job summary
        if: always()
        run: |
          { echo "### 无主键 release：PG ${{ matrix.src }} → PG ${{ matrix.dst }}"; echo;
            for f in nopk-*.json; do [ -f "$f" ] && { echo '```json'; cat "$f"; echo '```'; }; done; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nopk-release-pg${{ matrix.src }}-${{ matrix.dst }}
          path: nopk-*.json
