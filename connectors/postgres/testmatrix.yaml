# PostgreSQL 连接器可测性清单 —— 没有这个文件，CI 直接红。
name: postgres
dialect: postgres
image: postgres
versions:
  - "10.23"    # EOL 2022-11，尽力支持
  - "11.22"    # EOL 2023-11
  - "12.22"    # EOL 2024-11
  - "13.21"    # EOL 2025-11
  - "14.19"
  - "15.14"
  - "16.10"
  - "17.6"
  - "18.1"
tier: A
privileged: false
resources: { cpu: 2, mem_gb: 2, disk_gb: 4 }
startup:
  args:
    - "-c"
    - "wal_level=logical"
    - "-c"
    - "max_replication_slots=10"
    - "-c"
    - "max_wal_senders=10"
  env:
    POSTGRES_PASSWORD: root
capabilities:
  - snapshot
  - snapshot_export      # PG 10+ EXPORT_SNAPSHOT
  - cdc
  - ddl_whitelist
  - partial_columns
  - no_pk_detect
scenarios:
  - snapshot
  - incremental_crud
  - large_transaction
  - ddl_whitelist
  - crash_recovery
  - orphan_cleanup
  - type_boundary
notes: |
  PG 10 有原生 pgoutput，但无 TRUNCATE 复制、无 slot 磁盘阀、无 pg_replication_slot_advance()；
  13+ 才有 max_slot_wal_keep_size；14+ 流式大事务；15+ 行过滤/列清单；17+ slot 随主备切换存活；
  18 冲突检测视图 + idle_replication_slot_timeout。

# 组合分层：required 进每个 PR，nightly 才跑全量（docs/DESIGN.md §3）。
# total_pairs = 9×9 = 81；required = 9 自洽 + 8 相邻 + 2 极端 = 19。
matrix:
  total_pairs: 81
  required:
    - name: t1-self
      pairs: "每版本 → 自身"
      count: 9
      scenarios: [snapshot, incremental_crud, type_boundary]
    - name: t2-adjacent
      pairs: "n → n+1（10→11 … 17→18）"
      count: 8
      scenarios: [incremental_crud, ddl_whitelist]
    - name: t3-extremes
      pairs: "10 ↔ 18"
      count: 2
      scenarios: [incremental_crud]
  nightly:
    - name: t4-full
      pairs: "全部 9×9"
      count: 81
      scenarios: [snapshot, incremental_crud, large_transaction, ddl_whitelist, crash_recovery, orphan_cleanup, type_boundary]

# 异构：PG 9 × MySQL 4 × 2 方向 = 72，全部 nightly。
cross_matrix:
  target: mysql
  mysql_versions: 4
  pairs_per_direction: 36
  total_pairs: 72
  required: 0
  nightly: 72
  scenarios: [snapshot, incremental_crud, type_boundary]

# 无主键变体（docs/DESIGN-NO-PRIMARY-KEY.md §2.4）：格的定义/层数在 test/nopk-matrix.yaml。
# PG 这一侧没有待接通的格（PG→PG / MySQL→PG / PG→MySQL 三条方向都已接通；
# PG→MySQL 只全量，所以该方向只登记 snapshot / unique_key_once）。
no_pk:
  registry: test/nopk-matrix.yaml
  scenarios: [snapshot, insert, pause, downgrade, unique_key_once, unique_key_continuous]
  pending_cells: 0
