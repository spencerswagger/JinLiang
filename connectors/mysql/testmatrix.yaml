# MySQL 连接器可测性清单 —— 没有这个文件，CI 直接红。
# 见 docs/DESIGN.md 「测试与验证架构」
name: mysql
dialect: mysql
image: mysql
versions:
  - "5.7.44"   # EOL 2023-10，尽力支持
  - "8.0.43"   # EOL 2026-04，全支持
  - "8.4.7"    # LTS
  - "9.4.0"    # 创新版，跟随最新
tier: A               # A=上游 CI 可跑；B=需授权/自托管；C=仅人工
privileged: false
resources: { cpu: 2, mem_gb: 2, disk_gb: 4 }
startup:
  args:
    - "--log-bin=mysql-bin"
    - "--binlog-format=ROW"
    - "--binlog-row-image=FULL"
    - "--server-id=1001"
  env:
    MYSQL_ROOT_PASSWORD: root
capabilities:
  - snapshot
  - cdc
  - ddl_whitelist
  - partial_columns
  - no_pk_detect
scenarios:            # S1..S8
  - snapshot
  - incremental_crud
  - large_transaction
  - ddl_whitelist
  - crash_recovery
  - orphan_cleanup
  - type_boundary
notes: |
  MySQL 5.7 无 LOCK INSTANCE FOR BACKUP、无原子 DDL；
  8.4 起 SHOW MASTER STATUS 移除（用 SHOW BINARY LOG STATUS）、mysql_native_password 默认关闭；
  9.x 移除该插件。连接器一律运行时能力探测，不按版本号分支。

# 组合分层：total_pairs = 4×4 = 16；required = 4 自洽 + 3 相邻 = 7。
matrix:
  total_pairs: 16
  required:
    - name: t1-self
      pairs: "每版本 → 自身"
      count: 4
      scenarios: [snapshot, incremental_crud, type_boundary]
    - name: t2-adjacent
      pairs: "5.7→8.0→8.4→9.x"
      count: 3
      scenarios: [incremental_crud, ddl_whitelist]
  nightly:
    - name: t4-full
      pairs: "全部 4×4"
      count: 16
      scenarios: [snapshot, incremental_crud, large_transaction, ddl_whitelist, crash_recovery, orphan_cleanup, type_boundary]

# 无主键变体（docs/DESIGN-NO-PRIMARY-KEY.md §2.4）：格的定义/层数在 test/nopk-matrix.yaml，
# 这里只登记「本连接器这一侧」的账。
#
# **矩阵绿 ≠ MySQL 目标端已全覆盖**：MySQL→MySQL 方向未接通
# （internal/core/direction.go 的 pendingDirections，欠账 D6），这条方向的 4 条 T1 链路 ×
# 3 场景 = 12 格**全部待接通**。它们登记为 pending，`scripts/nopk_matrix.py` 永远不会把
# 它们算进 pass。目标端 insert-only 今天只有单测 + 本地真库 smoke（PG→MySQL 全量格）证明。
no_pk:
  registry: test/nopk-matrix.yaml
  scenarios: [snapshot, insert, pause]
  pending_cells: 12
  pending_reason: "MySQL→MySQL 方向未接通（D6）：4 条 T1 链路 × 3 场景，一格都不可执行"
